[project]
name = "entitygate"
version = "0.1.0"
description = "Catch entity misattribution in LLM-extracted facts -- a failure mode groundedness checks structurally can't see."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
benchmark = ["openai>=1.0"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["entitygate*"]
